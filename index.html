	<main class="w-full">
		<section id="inicio" class="relative flex pt-8 px-6 md:px-24 space-y-6 md:space-y-0 md:space-x-4 md:min-h-screen-90 h-96">

        <section id="proyectos" class="relative py-24 px-12">
            <div class="absolute flex justify-end mb-4 right-10 top-20">
                <button id="prevBtn" class="bg-blue-500 text-white px-4 py-2 rounded-full shadow-lg hover:bg-blue-800 disabled:opacity-50 disabled:bg-white disabled:text-gray-500 disabled:cursor-not-allowed mr-2"><</button>
                <button id="nextBtn" class="bg-blue-500 text-white px-4 py-2 rounded-full shadow-lg hover:bg-blue-800 disabled:opacity-50 disabled:bg-white disabled:text-gray-500 disabled:cursor-not-allowed">></button>
            </div>
        </section>

        <section id="testimonios" class="py-24 bg-gray-900 text-white relative overflow-hidden">
            <h3 id="testimoniosTitle" class="text-sm font-bold text-start mb-4 text-blue-500 uppercase translatable animate-fadeIn mx-12" data-en="Testimonials" data-es="Testimonios">Testimonios</h3>
            <h2 id="testimoniosSubtitle" class="text-2xl font-bold text-start mb-4 translatable animate-fadeInDelay mx-12" data-en="What clients say" data-es="Lo que dicen los clientes">Lo que dicen los clientes</h2>
            <div class="absolute right-10 top-20 z-10 flex space-x-4">
                <button id="prevTestimonio" class="bg-blue-500 text-white px-4 py-2 rounded-full shadow-lg hover:bg-blue-800 disabled:opacity-50 disabled:bg-white disabled:text-gray-500 disabled:cursor-not-allowed">&lt;</button>

        <section id="contacto" class="bg-blue-100 py-24 px-4 md:px-12 flex flex-col md:flex-row border-box space-y-8 md:space-y-0 md:space-x-4">
            <div class="w-full md:w-1/2">
                <h3 id="contactTitle" class="text-sm font-bold text-start mb-4 text-blue-500 uppercase translatable animate-fadeIn" data-aos="fade-up"></h3>
                <h2 id="contactSubtitle" class="text-2xl md:text-4xl font-bold text-start mb-4 translatable animate-fadeInDelay" data-aos="fade-up" data-aos-delay="200"></h2>
                <p id="contactDescription" class="translatable" data-aos="fade-up" data-aos-delay="400"></p>
            </div>
            <form id="formulario" class="w-full md:w-1/2">
                <div class="mb-4" data-aos="fade-up" data-aos-delay="600">
                    <label for="name" id="nameLabel" class="block text-gray-700 translatable"></label>
                    <input type="text" name="nombre" id="name" class="w-full px-4 py-2 border rounded translatable" placeholder="" required>
                </div>
                <div class="mb-4" data-aos="fade-up" data-aos-delay="800">
                    <label for="email" id="emailLabel" class="block text-gray-700 translatable"></label>
                    <input type="email" name="correo" id="email" class="w-full px-4 py-2 border rounded translatable" placeholder="" required>
                </div>
                <div class="mb-4" data-aos="fade-up" data-aos-delay="1000">
                    <label for="subject" id="subjectLabel" class="block text-gray-700 translatable"></label>
                    <input type="text" name="sujeto" id="subject" class="w-full px-4 py-2 border rounded translatable" placeholder="" required>
                </div>
                <div class="mb-4" data-aos="fade-up" data-aos-delay="1200">
                    <label for="message" id="messageLabel" class="block text-gray-700 translatable"></label>
                    <textarea id="message" name="mensaje" class="w-full px-4 py-2 border rounded translatable" rows="4" placeholder="" required></textarea>
                </div>
                <button type="submit" id="enviar" class="bg-blue-500 text-white px-4 py-2 rounded translatable" data-aos="fade-up" data-aos-delay="1400"></button>
                <div id="redesSociales" class="w-full mt-8 flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                </div>
            </form>
        </section>

    <script>
        AOS.init();

        document.addEventListener('DOMContentLoaded', () => {
            updateMenu('es').then(seccionesActivas => {
                if (seccionesActivas['inicio']) cargarInicio('es');
                if (seccionesActivas['sobre-mi']) cargarSobreMi('es');
                if (seccionesActivas['proyectos']) cargarProyectos('es');
                if (seccionesActivas['testimonios']) cargarTestimonios('es');
                if (seccionesActivas['contacto']) cargarContacto('es');
            });
        });
    </script>
    <script src="js/lang.js"></script>

    <script type="text/javascript">
        emailjs.init("3TKcLSS1q0tyaNTdp");
    </script>
    <script type="text/javascript">
        window.onload = function() {
            const btn = document.getElementById('enviar');
            const form = document.getElementById('formulario');

            const mensajes = {
                es: {
                    success: {
                        title: 'Mensaje enviado',
                        text: '¡Gracias por comunicarte conmigo!'
                    },
                    error: {
                        title: 'Mensaje fallido',
                        text: 'Vuelve a intentar más tarde'
                    }
                },
                en: {
                    success: {
                        title: 'Message sent',
                        text: 'Thank you for reaching out to me!'
                    },
                    error: {
                        title: 'Message failed',
                        text: 'Please try again later'
                    }
                }
            };
    
            form.addEventListener('submit', function(event) {
                event.preventDefault();
    
                btn.value = 'Sending...';
    
                const serviceID = 'service_7akbgc6';
                const templateID = 'template_5z4eo2l';
    
                emailjs.sendForm(serviceID, templateID, this)
                    .then(() => {
                        Swal.fire({
                            icon: 'success',
                            title: mensajes[currentLang].success.title,
                            text: mensajes[currentLang].success.text,
                            showConfirmButton: false,
                            timer: 1500
                        });
                        form.reset();
                    }, (err) => {
                        Swal.fire({
                            icon: 'error',
                            title: mensajes[currentLang].error.title,
                            text: mensajes[currentLang].error.text,
                            showConfirmButton: false,
                            timer: 1500
                        });
                        console.error(err);
                    });
            });
        }
    </script>

    <script>
        document.getElementById('menu-button').addEventListener('click', () => {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });
    </script>
